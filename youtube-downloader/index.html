<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Downloader</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f6df6'/><path d='M16 7v12m0 0l-5-5m5 5l5-5M9 24h14' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9"/><path class="glyph" d="M16 7v12m0 0l-5-5m5 5l5-5M9 24h14"/></svg>
      </span>
      YouTube Downloader
    </h1>
    <button id="settings-toggle" class="ghost" aria-expanded="false">Settings</button>
  </header>

  <section id="settings" class="settings" hidden>
    <label class="field">
      <span>Save downloads to</span>
      <input type="text" id="download-dir" spellcheck="false" autocomplete="off">
    </label>
    <label class="field narrow">
      <span>Default quality</span>
      <select id="default-quality"></select>
    </label>
    <button id="save-settings" class="secondary">Save</button>
    <p class="hint">Files are written straight to this folder on your machine. Downloading is done by <code>yt-dlp</code>.</p>
  </section>

  <main>
    <form id="add-form" class="add">
      <input type="url" id="url" placeholder="Paste a video URL…" autocomplete="off" spellcheck="false" required>
      <select id="quality" aria-label="Quality"></select>
      <button type="submit" id="submit">Download</button>
      <label class="check" id="playlist-row" hidden>
        <input type="checkbox" id="playlist">
        <span>This link is a playlist — queue every video in it</span>
      </label>
    </form>
    <p id="error" class="error" hidden></p>

    <div id="bulk" class="bulk" hidden>
      <span id="bulk-count" class="bulk-count"></span>
      <label class="check">
        <input type="checkbox" id="delete-files">
        <span>Also delete files</span>
      </label>
      <button type="button" id="cancel-all" class="secondary">Cancel all</button>
      <button type="button" id="delete-all" class="danger">Delete all</button>
    </div>

    <div id="list"class="list" aria-live="polite"></div>

    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6v24m0 0l-9-9m9 9l9-9M8 36v4a2 2 0 002 2h28a2 2 0 002-2v-4"/></svg>
      <h2>Nothing downloaded yet</h2>
      <p>Paste a video link above and pick a quality. Downloads land in your save folder and stay listed here.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
