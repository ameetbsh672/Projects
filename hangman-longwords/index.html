<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hangman: Long Words</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>Hangman <span class="subtitle">— long word edition</span></h1>
    <div class="stats" id="stats">
      <span id="stat-words">— words</span>
      <span id="stat-wins">0 wins</span>
      <span id="stat-losses">0 losses</span>
    </div>
  </header>

  <main class="board">
    <section class="gallows-panel">
      <svg class="gallows" viewBox="0 0 200 220" aria-hidden="true">
        <line x1="10" y1="210" x2="140" y2="210" class="part base" />
        <line x1="40" y1="210" x2="40" y2="20" class="part pole" />
        <line x1="40" y1="20" x2="130" y2="20" class="part beam" />
        <line x1="130" y1="20" x2="130" y2="45" class="part rope" />

        <circle cx="130" cy="65" r="20" class="part figure head" data-stage="1" />
        <line x1="130" y1="85" x2="130" y2="140" class="part figure body" data-stage="2" />
        <line x1="130" y1="95" x2="105" y2="120" class="part figure arm-left" data-stage="3" />
        <line x1="130" y1="95" x2="155" y2="120" class="part figure arm-right" data-stage="4" />
        <line x1="130" y1="140" x2="110" y2="175" class="part figure leg-left" data-stage="5" />
        <line x1="130" y1="140" x2="150" y2="175" class="part figure leg-right" data-stage="6" />
      </svg>
      <p class="wrong-count" id="wrong-count">0 / 6 wrong guesses</p>
      <div class="wrong-letters" id="wrong-letters"></div>
    </section>

    <section class="play-panel">
      <p class="word" id="word-display" aria-live="polite">&nbsp;</p>

      <div class="keyboard" id="keyboard"></div>

      <p class="message" id="message" aria-live="polite"></p>

      <div class="controls">
        <label for="difficulty">Word length</label>
        <select id="difficulty">
          <option value="short">Short (5–6)</option>
          <option value="medium" selected>Medium (7–9)</option>
          <option value="long">Long (10–15)</option>
          <option value="any">Any length</option>
        </select>
        <button id="new-game-btn">New Game</button>
      </div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
